description: 'Millennium Pharmaceuticals was a biopharmaceutical company based in Cambridge, Massachusetts,
  focused on oncology and inflammation, best known for developing the cancer drug Velcade (bortezomib).
  Backed early by Kleiner Perkins, it was acquired by Takeda Pharmaceutical Company in 2008 for $8.8B and
  its brand was retired to "Takeda Oncology" in 2013; it no longer operates as an independent company.
  Surfaced in the API Evangelist network as a VC-portfolio stub. This is a research/company profile with
  no independent developer API surface — the pipeline confirmed the provider publishes no public API,
  developer portal, SDKs, or event/webhook surface.'
